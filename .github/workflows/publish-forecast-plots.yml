name: Publish forecast plots

on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even when the NWS update time is unchanged
        required: false
        default: false
        type: boolean
  # Checking often is nearly free and does not cost R2 quota: a run whose NWS update
  # time is unchanged exits in about two minutes without writing anything, and this repo
  # is public so Actions minutes are unmetered. Checking *more* often does not publish
  # more often either — the number of real publishes is set by how often NWS reissues,
  # not by how often we look — it only shortens how long the site shows a stale forecast.
  # So this stays dense. To publish less (which is a real lever on the R2 object budget),
  # gate the publisher on a minimum interval; don't thin the schedule.
  schedule:
    # Normal monitoring: once per hour, away from the busiest top-of-hour window.
    - cron: "27 * * * *"
      timezone: "America/New_York"
    # Higher-frequency checks around the normal 03–04 and 15–16 issuance windows.
    - cron: "45,55 2,14 * * *"
      timezone: "America/New_York"
    - cron: "5,15,25,35,45,55 3,15 * * *"
      timezone: "America/New_York"
    - cron: "5,15,25 4,16 * * *"
      timezone: "America/New_York"

concurrency:
  group: forecast-plot-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A release is 4 offices × 40 canvases. Measured end to end the pipeline is minutes,
    # not tens of minutes, so this ceiling exists to kill a run that has *stalled* —
    # usually waiting on api.weather.gov — rather than to accommodate a slow one. If a
    # run ever approaches it, the cause is a hang, not the plot count.
    # Raised from 45, which a cold run overshot and died on. The phases now each have
    # their own ceiling — fetch 12 min, capture 15 min — so the job should finish well
    # inside this; it is a backstop for a stall, not a budget to fill.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
      PLOT_SITE_URL: http://localhost:3000
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      RELEASE_RETENTION_COUNT: ${{ vars.RELEASE_RETENTION_COUNT }}
      # How many offices get pre-rendered PNGs, most populous first. Every drawable office
      # gets forecast *data* regardless — that is what lets it render at all. Unset uses
      # the script default of 24 (~110 MB and ~27 s per office when measured locally).
      RENDER_OFFICE_COUNT: ${{ vars.RENDER_OFFICE_COUNT }}
      # Per-phase ceilings. A cold run defers whatever does not fit rather than failing:
      # deferred offices stay out of forecast/index.json, so the next probe still sees
      # them as stale and picks them up. Cold start converges over a few runs.
      PLOT_FETCH_BUDGET_MS: ${{ vars.PLOT_FETCH_BUDGET_MS }}
      PLOT_CAPTURE_BUDGET_MS: ${{ vars.PLOT_CAPTURE_BUDGET_MS }}
      # Narrows both tiers to a named set, for re-running one office after a failure.
      PLOT_OFFICES: ${{ vars.PLOT_OFFICES }}

    steps:
      - name: Check publication configuration
        id: publication
        shell: bash
        run: |
          if [[ -n "$R2_ACCOUNT_ID" && -n "$R2_ACCESS_KEY_ID" && -n "$R2_SECRET_ACCESS_KEY" && -n "$R2_BUCKET" && -n "$R2_PUBLIC_BASE_URL" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Forecast publication is waiting for the documented R2 secrets and variables."
          fi

      - name: Check out source
        if: steps.publication.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.publication.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.publication.outputs.enabled == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.publication.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build forecast site
        if: steps.publication.outputs.enabled == 'true'
        run: npm run build

      # The publisher used to drive the Vite dev server, which renders through
      # unminified modules and a development build of React. Serving the production
      # build instead renders an office in 11.6s where dev took 25.1s — better than
      # twice over, for one build step.
      - name: Start forecast site
        if: steps.publication.outputs.enabled == 'true'
        run: |
          npm run start -- --port 3000 > /tmp/phi-forecast-site.log 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/phi-forecast-site.log
          exit 1

      - name: Publish changed forecast plots
        if: steps.publication.outputs.enabled == 'true'
        run: npm run plots:publish
